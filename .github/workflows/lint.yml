name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install shell linters
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck shfmt

      - name: Check shell scripts
        run: shellcheck -x bin/* lib/*

      - name: Check shell formatting
        run: shfmt -d bin/* lib/*
